name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Tests (Julia ${{ matrix.julia-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: |
          julia --project=. -e 'using Pkg; Pkg.add(PackageSpec(url="https://github.com/MGYamada/MAGMA.jl.git", rev="5545b1a27ee2516d9766c6a15238f006eceb1629")); Pkg.instantiate()'
      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Instantiate docs
        run: |
          julia --project=docs -e 'using Pkg; Pkg.add(PackageSpec(url="https://github.com/MGYamada/MAGMA.jl.git", rev="5545b1a27ee2516d9766c6a15238f006eceb1629")); Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build docs
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
